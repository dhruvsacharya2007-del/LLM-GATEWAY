services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-gw-postgres
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: llm_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
   
    image: redis/redis-stack:latest
    container_name: llm-gw-redis
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata: